<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <!-- SoundReady top-bar logo: play-mark + wordmark, transparent background.
       Wordmark uses Space Grotesk (as on the site); falls back to Arial. -->
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');</style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1a9e50"/>
    </linearGradient>
  </defs>

  <!-- Play-mark, same geometry as the top bar -->
  <g transform="translate(4,4) scale(1.12)">
    <path d="M10 92 L70 92 L108 50 L70 8 L10 8 Z" fill="#0a3d1e" transform="translate(3,4)"/>
    <path d="M10 90 L68 90 L106 50 L68 10 L10 10 Z" fill="url(#bgGrad)"/>
    <path d="M10 90 L38 90 L38 10 L10 10 Z" fill="#1a9e50" opacity="0.5"/>
    <path d="M22 72 L50 44 L58 60 L78 36 M78 36 L78 50 M78 36 L64 36"
      stroke="white" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark: dark-theme colors as shown in the top bar -->
  <text x="137" y="84" font-family="'Space Grotesk', Arial, sans-serif" font-weight="900"
        font-size="70" letter-spacing="-1.75">
    <tspan fill="#fafafa">sound</tspan><tspan fill="#69f29b">ready</tspan>
  </text>
</svg>
